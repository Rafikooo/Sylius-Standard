services:
    # Default configuration for services in *this* file
    _defaults:
        # Automatically injects dependencies in your services
        autowire: true

        # Automatically registers your services as commands, event subscribers, etc.
        autoconfigure: true

        # Allows optimizing the container by removing unused services; this also means
        # fetching services directly from the container via $container->get() won't work
        public: false

    _instanceof:
        Sylius\Bundle\ResourceBundle\Controller\ResourceController:
            autowire: false
        Sylius\Bundle\ResourceBundle\Form\Type\AbstractResourceType:
            autowire: false

    # Makes classes in src/ available to be used as services;
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/*'
        exclude: '../src/{Entity,Kernel.php,Command}'

    # Controllers are imported separately to make sure services can be injected
    # as action arguments even if you don't extend any base controller class
    App\Controller\:
        resource: '../src/Controller'
        tags: ['controller.service_arguments']

    app.command_provider.stripe:
        class: Sylius\Bundle\PaymentBundle\CommandProvider\ActionsCommandProvider
        arguments:
            - !tagged_locator { tag: sylius.command_provider.payment_request.stripe, index_by: action }
        tags:
            - { name: sylius.payment_request.command_provider, gateway-factory: stripe }    

    app.command_provider.http_response.stripe:
        class: Sylius\Bundle\PaymentBundle\Provider\ActionsHttpResponseProvider
        arguments:
            - !tagged_locator
                tag: sylius.command_provider.http_response.payment_request.stripe
                index_by: action
        tags:
            - { name: sylius.payment_request.provider.http_response, gateway-factory: stripe }    

    App\CommandHandler\CaptureStripePaymentRequestHandler:
        class: App\CommandHandler\CaptureStripePaymentRequestHandler
        arguments:
            - '@sylius.provider.payment_request'
            - '%env(STRIPE_GATEWAY_CONFIGURATION_SECRET_KEY)%'
